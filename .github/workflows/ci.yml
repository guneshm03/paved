name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-only: true
      - name: make check (fmt, vet, lint, race tests, coverage gate)
        run: make check
      - name: make demo (offline end-to-end run against the fixture)
        run: make demo
