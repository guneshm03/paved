apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: catalog-service
  title: Product catalog service
  description: Product, price and availability lookups.
  links:
    - url: https://oncall.acme.example/schedules/growth
      title: Growth on-call
      type: oncall
  tags: [python]
spec:
  type: service
  lifecycle: production
  owner: team-growth
  system: storefront
  providesApis: [catalog-api]
  consumesApis: [auth-api]
  dependsOn: [resource:catalog-db]
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: catalog-api
  description: Product catalog lookups.
spec:
  type: openapi
  lifecycle: production
  owner: team-growth
  system: storefront
  definition: |
    openapi: 3.0.0
    info: {title: Catalog API, version: 1.0.0}
    paths: {}
